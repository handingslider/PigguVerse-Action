name: GKI Kernel Build
on:
  workflow_dispatch:
    inputs:
      susfs:
        description: "Include SUSFS?"
        type: boolean
        default: true
  workflow_call:
    inputs:
      susfs:
        type: boolean
        default: true
    outputs:
      kernel_version:
        description: "The kernel version"
        value: ${{ jobs.build-gki.outputs.kernel_version }}

permissions:
  contents: write

jobs:
  build-gki:
    name: Build GKI (${{ matrix.root }}, ${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      kernel_version: ${{ steps.get-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        root: [ReSukiSU, NoRoot]
        variant: [GKI, AOSP]
        perf: [false, true]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          mkdir -p "$KERNEL_ROOT"

          cat >> "$GITHUB_ENV" << EOF
          DATE=$(date '+%Y%m%d_%H%M')
          DEVICE=duchamp
          KERNEL_ROOT=$KERNEL_ROOT
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          WILD_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          DROIDSPACES=$GITHUB_WORKSPACE/droidspaces
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: Setup Bazel Cache Dir
        uses: ./.github/actions/cache-bazel-setup

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio device-tree-compiler dwarves flex libelf-dev libssl-dev \
            python3 zstd
          # Not needed for Image-only GKI builds, but keep them when apt has them
          sudo apt-get install -y --no-install-recommends mkbootimg avbtool \
            || echo "mkbootimg/avbtool not available from apt - skipping"

          for tool in pahole dtc mkbootimg avbtool zstd cpio bc bison flex python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "OK: $tool -> $(command -v "$tool")"
            else
              echo "::warning::$tool not found"
            fi
          done
          echo "Cross setup: ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 (hermetic clang from bazel)"

      - name: Clone AnyKernel3
        run: |
          ANYKERNEL3_BRANCH="master"
          git clone https://github.com/handingslider/AnyKernel3 -b "$ANYKERNEL3_BRANCH"
          rm -rf AnyKernel3/.git

      - name: Clone Wild Patches
        run: |
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git "$WILD_PATCHES"

      - name: Initialize and Sync Kernel Source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1-lts --repo-rev=v2.16 --depth=1
          if [[ "${{ matrix.variant }}" == "AOSP" ]]; then
            git clone https://github.com/mt6897-devs/kernel_manifest .repo/local_manifests
          fi
          repo --trace sync -c -j$(nproc --all) --fail-fast --no-tags --force-sync --no-clone-bundle

      - name: Set Kernel Source Directory
        run: |
          if [[ "${{ matrix.variant }}" == "AOSP" ]]; then
            echo "KERNEL_SOURCE=kernel-6.1" >> "$GITHUB_ENV"
          else
            echo "KERNEL_SOURCE=common" >> "$GITHUB_ENV"
          fi

      - name: Get Kernel Version
        id: get-version
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          VERSION=$(grep -E "^VERSION =" Makefile | head -n 1 | awk '{print $3}')
          PATCHLEVEL=$(grep -E "^PATCHLEVEL =" Makefile | head -n 1 | awk '{print $3}')
          SUBLEVEL=$(grep -E "^SUBLEVEL =" Makefile | head -n 1 | awk '{print $3}')
          echo "version=${VERSION}.${PATCHLEVEL}.${SUBLEVEL}" >> "$GITHUB_OUTPUT"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Restore Bazel Cache
        id: restore-bazel
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: duchamp-${{ steps.get-version.outputs.version }}
          cache_bucket: bazel-cache-duchamp-${{ matrix.variant }}${{ matrix.perf && '-perf' || '' }}${{ matrix.root == 'NoRoot' && '-noroot' || '' }}
          restore_keys: |
            duchamp-

      - name: Save Build Metadata
        run: |
          mkdir -p buildinfo
          echo "${{ matrix.variant }}|${{ matrix.root }}|${{ steps.get-version.outputs.version }}" > "buildinfo/${{ matrix.variant }}-${{ matrix.root }}.txt"

      - name: Upload Build Metadata
        uses: actions/upload-artifact@v4
        with:
          name: buildinfo-${{ matrix.variant }}-${{ matrix.root }}
          path: buildinfo-${{ matrix.variant }}-${{ matrix.root }}.txt

      - name: Add Root
        if: matrix.root != 'NoRoot'
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Integrate SUSFS
        if: inputs.susfs && matrix.root != 'NoRoot'
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 "$GITHUB_WORKSPACE/susfs"
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/fs/"* fs/
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/"* include/linux/
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" ./
          SUSFS_PATCH=50_add_susfs_in_gki-android14-6.1.patch

          if [ "$SUBLEVEL" -le "25" ]; then
            echo "Fake patch: base.c <=25"
            sed -i '/^#include <trace\/events\/oom.h>$/a #include <trace/hooks/sched.h>' fs/proc/base.c
          fi
          if [ "$SUBLEVEL" -le "141" ]; then
            echo "Fake patch: base.c <=141"
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
          fi
          if [ "$SUBLEVEL" -ge "157" ]; then
            echo "Fake patch: namespace.c >=157"
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            echo "Applying super.c Android 14 6.1 Fake Patch"
            sed -i '/^#include <trace\/hooks\/fs.h>$/,+1 d' fs/super.c
          fi

          # AOSP trees lack trace/hooks/blk.h: drop that context line AND fix hunk counts
          python3 "$GITHUB_WORKSPACE/.github/scripts/fix_susfs_patch.py" "$SUSFS_PATCH"

          set +e
          patch -p1 --no-backup-if-mismatch < "$SUSFS_PATCH"
          PATCH_RC=$?
          set -e
          echo "susfs patch exit code: $PATCH_RC"

          FIXED=false
          # android14-6.1 >= 157 shifted the include block: hunk #1 (includes only) rejects
          if [ -f fs/namespace.c.rej ]; then
            FIXED=true
            echo "::group::fs/namespace.c.rej"
            cat fs/namespace.c.rej
            echo "::endgroup::"
            if grep -q 'susfs_def\.h' fs/namespace.c.rej && ! grep -q 'susfs_def\.h' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <linux/susfs_def.h>' fs/namespace.c
            fi
            if grep -q '<linux/susfs\.h>' fs/namespace.c.rej && ! grep -q '<linux/susfs\.h>' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <linux/susfs.h>' fs/namespace.c
            fi
            rm -f fs/namespace.c.rej
          fi

          mapfile -t REJECTS < <(find . -name '*.rej')
          if [ "${#REJECTS[@]}" -gt 0 ]; then
            for rej in "${REJECTS[@]}"; do
              echo "::group::Unresolved reject: $rej"
              cat "$rej"
              echo "::endgroup::"
            done
            echo "::error::SUSFS patch left ${#REJECTS[@]} unapplied hunk(s)"
            exit 1
          fi
          if [ "$PATCH_RC" -ne 0 ] && [ "$FIXED" != "true" ]; then
            echo "::error::SUSFS patch failed with exit code $PATCH_RC"
            exit 1
          fi

          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          fi
          if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
          fi

      - name: Revert SUSFS Fake Patches
        if: inputs.susfs && matrix.root != 'NoRoot'
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          if [ "$SUBLEVEL" -le "25" ]; then
            sed -i '/^#include <trace\/hooks\/sched.h>$/d' fs/proc/base.c
          fi
          if [ "$SUBLEVEL" -le "141" ]; then
            sed -i '/^#include <linux\/dma-buf.h>$/d' fs/proc/base.c
          fi
          if [ "$SUBLEVEL" -ge "157" ]; then
            sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
            echo "Reverting super.c Android 14 6.1 Fake Patch"
            sed -i '/^#include "internal.h"$/a #include <trace/hooks/fs.h>' fs/super.c
          fi
          
      - name: Enable susfs
        if: inputs.susfs && matrix.root != 'NoRoot'
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_SUSFS_SUS_PATH=y
            CONFIG_KSU_SUSFS_SUS_MOUNT=y
            CONFIG_KSU_SUSFS_SUS_KSTAT=y
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y
            CONFIG_KSU_SUSFS_ENABLE_LOG=y
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
            CONFIG_KSU_SUSFS_SUS_MAP=y

      - name: Disable Root and SUSFS configs
        if: matrix.root == 'NoRoot'
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --disable CONFIG_KSU --disable CONFIG_KSU_SUSFS
          if grep -qE '^CONFIG_KSU(_SUSFS)?=y' arch/arm64/configs/gki_defconfig; then
            echo "::error::KSU configs are still enabled in a NoRoot build"
            exit 1
          fi
          echo "NoRoot: CONFIG_KSU and CONFIG_KSU_SUSFS disabled"

      - name: Add backported BBRv3
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          patch -p1 < "$WILD_PATCHES/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" || true

      - name: Enable BBRv3 config
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_TCP_CONG_ADVANCED=y
            CONFIG_TCP_CONG_BBR3=y
            CONFIG_DEFAULT_BBR3=y
            CONFIG_TCP_CONG_BIC=y
            CONFIG_TCP_CONG_WESTWOOD=y
            CONFIG_TCP_CONG_HTCP=y
            CONFIG_TCP_CONG_CUBIC=y
            CONFIG_DEFAULT_TCP_CONG="bbr"

      - name: Add NTSYNC Patches
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          patch -p1 < "$WILD_PATCHES/common/ntsync/ntsync_compat_android14-6.1.patch" || true
          patch -p1 < "$WILD_PATCHES/common/ntsync/ntsync_base.patch" || true
      - name: Enable NTSYNC
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_NTSYNC=y

      - name: Add DroidSpaces
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch || true

      - name: Enable DroidSpaces config
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_PID_NS=y
            CONFIG_SYSVIPC=y
            CONFIG_POSIX_MQUEUE=y
            CONFIG_IPC_NS=y
            CONFIG_DEVTMPFS=y
            CONFIG_BINFMT_MISC=y
            CONFIG_BINFMT_SCRIPT=y
            CONFIG_BINFMT_ELF=y
            CONFIG_USER_NS=y

      - name: Add Wild performance patches
        if: matrix.perf == true
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          for p in disable_cache_hot_buddy mem_opt_prefetch optimise_memcmp \
             optimized_mem_operations file_struct_8bytes_align reduce_cache_pressure \
             f2fs_reduce_congestion f2fs_enlarge_min_fsync_blocks reduce_gc_thread_sleep_time \
             minimise_wakeup_time int_sqrt add_timeout_wakelocks_globally reduce_freeze_timeout \
             increase_ext4_default_commit_age increase_sk_mem_packets reduce_pci_pme_wakeups \
             silence_irq_cpu_logspam silence_system_logspam; do
            patch -p1 -F3 < "$WILD_PATCHES/common/${p}.patch" || true
          done

          cat "$WILD_PATCHES/common/clear_page_16bytes_align.patch" | \
            sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | \
            patch -p1 -F3 || true

          FILE="drivers/base/power/wakeup.c"
          if grep -q "^void pm_system_wakeup(void)" "$FILE"; then
            if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
              sed -i '/^void pm_system_wakeup(void)/,/^}/{/suspend_abort_fs_sync();/d}' "$FILE"
            fi
          fi
          patch -p1 -F3 < "$WILD_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch" || true

      - name: Configuration
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_WERROR=n
            CONFIG_TRIM_UNUSED_KSYMS=n
            CONFIG_LOCALVERSION="-PigguVerse"

      - name: Cleanup protected exports
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          rm -rf ./android/abi_gki_protected_exports_*
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./BUILD.bazel
          sed -i 's/check_defconfig//' ./build.config.gki

      - name: Commit Changes
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Integrate KernelSU" || true

      - name: Build Kernel with Bazel (LTO disabled)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -o pipefail
          tools/bazel build --config=fast --config=stamp --lto=none \
            --disk_cache=/home/runner/.cache/bazel \
            //${{ env.KERNEL_SOURCE }}:kernel_aarch64_dist 2>&1 | tee build.log

      - name: Copy image to AnyKernel3
        run: |
          IMAGE_PATH="$KERNEL_ROOT/bazel-out/k8-fastbuild/bin/${KERNEL_SOURCE}/kernel_aarch64/Image"
          cp "$IMAGE_PATH" "$ANYKERNEL3/Image"

      - name: Save Bazel Cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: duchamp-${{ steps.get-version.outputs.version }}
          cache_bucket: bazel-cache-duchamp-${{ matrix.variant }}${{ matrix.perf && '-perf' || '' }}${{ matrix.root == 'NoRoot' && '-noroot' || '' }}
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Package AnyKernel3
        run: |
          cd AnyKernel3
          zip -r9 "../PigguVerse-${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }}${{ matrix.root == 'NoRoot' && '-NoRoot' || '' }}-${{ env.DATE }}.zip" *

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: PigguVerse-${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }}${{ matrix.root == 'NoRoot' && '-NoRoot' || '' }}-${{ env.DATE }}
          path: ./PigguVerse-${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }}${{ matrix.root == 'NoRoot' && '-NoRoot' || '' }}-${{ env.DATE }}.zip

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }}${{ matrix.root == 'NoRoot' && '-NoRoot' || '' }}-${{ env.DATE }}
          path: |
            ${{ env.KERNEL_ROOT }}/build.log
            ${{ env.KERNEL_ROOT }}/**/*.rej
          if-no-files-found: ignore
